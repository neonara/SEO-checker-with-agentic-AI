name: CI

# main  -> tests only. Integration branch: merge and test here, never deploys.
# prod  -> tests, build the image and push it to GHCR, deploy it to the VPS.
#          To release: merge main into prod.
on:
  push:
    branches: [main, prod]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a prod run half-way through a deploy.
  cancel-in-progress: ${{ github.ref != 'refs/heads/prod' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Same command as locally: the suite runs inside the image, offline.
      - name: Run tests
        run: docker compose run --rm --build test

  # Build the runtime image and push it to GitHub's registry, tagged with the
  # commit (what the VPS runs) and with the moving `prod` tag.
  image:
    needs: test
    if: github.ref == 'refs/heads/prod' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # Registry login: the GHCR_PAT secret (a personal access token with
      # write:packages), as the user it belongs to. Without that secret this
      # falls back to the run's own token, which only works where the
      # organisation lets Actions write packages.
      - name: Build and push to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ vars.GHCR_USER || 'neonara' }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          # The source label ties the package to this repository on GitHub.
          docker build --target runtime \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:prod" .
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:prod"

  # The VPS never sees the source: it gets one compose file and pulls the image.
  deploy:
    needs: image
    if: github.ref == 'refs/heads/prod' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      # Optional: pin the server's host key instead of trusting whatever
      # answers on first contact (output of `ssh-keyscan <host>`).
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT || '22' }}
      VPS_PATH: ${{ vars.VPS_PATH || '/opt/seo-checker' }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up SSH
        run: |
          for name in VPS_HOST VPS_USER VPS_SSH_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not set (repo Settings -> Secrets and variables -> Actions)."
              exit 1
            fi
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$VPS_KNOWN_HOSTS" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$VPS_SSH_PORT" -H "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName $VPS_HOST
            User $VPS_USER
            Port $VPS_SSH_PORT
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      # The server's .env sits next to this file and is never touched.
      - name: Copy the compose file to the VPS
        run: |
          ssh vps "mkdir -p '$VPS_PATH'"
          scp -q deploy/docker-compose.yml "vps:$VPS_PATH/docker-compose.yml"

      # deploy/deploy.sh runs on the VPS: pull this commit's image, switch to
      # it, roll back to the previous one if it does not come up healthy.
      # The registry token goes over stdin (first line), never on a command
      # line, and is used through a throwaway Docker config on the VPS, so it
      # is not left behind there.
      - name: Pull the image and restart
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ vars.GHCR_USER || 'neonara' }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          { printf '%s\n' "$GHCR_TOKEN"; cat deploy/deploy.sh; } | ssh vps \
            "env VPS_PATH='$VPS_PATH' IMAGE='$IMAGE' IMAGE_TAG='$GITHUB_SHA' GHCR_USER='$GHCR_USER' \
             bash -c 'IFS= read -r GHCR_TOKEN; export GHCR_TOKEN; exec bash -s'"
